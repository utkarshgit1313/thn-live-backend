name: Sync Archive with YouTube Metadata

on:
  schedule:
    - cron: '0 */3 * * *' # हर 3 घंटे में अपने आप चलेगा
  workflow_dispatch: # मैन्युअल बटन से तुरंत चलाने के लिए

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -U yt-dlp internetarchive

      - name: Run Sync Script
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python sync.py

      - name: Commit and push episodes.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add episodes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update episodes.json" && git push)
